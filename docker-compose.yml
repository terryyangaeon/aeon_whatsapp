services:
  waha:
    # Pinned to 2026.9.2 after 2026.10.1 shipped a broken whatsapp-web.js
    # that crashes with "LifecycleWatcher disposed" during session init.
    # Revisit when devlikeapro ships a fix (expected within days).
    image: devlikeapro/waha:latest-2026.9.2
    container_name: waha-iot
    restart: unless-stopped
    networks:
      - coolify
    volumes:
      - sessions-v2:/app/.sessions
    environment:
      WHATSAPP_API_KEY:          ${WHATSAPP_API_KEY}
      WAHA_SESSION:              ${WAHA_SESSION:-default}
      WHATSAPP_API_HOSTNAME:     ${WHATSAPP_API_HOSTNAME:-0.0.0.0}
      WAHA_DASHBOARD_USERNAME:   ${WAHA_DASHBOARD_USERNAME:-aeon}
      WAHA_DASHBOARD_PASSWORD:   ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-aeon}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD}
      WAHA_LOG_FORMAT:           ${WAHA_LOG_FORMAT:-JSON}
      WHATSAPP_DEFAULT_ENGINE:   ${WHATSAPP_DEFAULT_ENGINE:-WEBJS}

    # Chromium needs 1.5-2 GB during WhatsApp Web init on Hostinger KVM.
    # Earlier 768 MB cap caused page frames to detach during /api/sessions/.../start,
    # producing the `LifecycleWatcher disposed` error. Keep the headroom and let the
    # Coolify UI's Resource Limits panel narrow it back down if needed.
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    # Explicit DNS — Hostinger KVM sometimes resolves WhatsApp Web through
    # IPv6-only paths that Puppeteer's network client mishandles.
    dns:
      - 1.1.1.1
      - 8.8.8.8

    # Traefik labels: Coolify's Traefik is the only proxy on this host.
    # We borrow it for SSL + routing without letting Coolify manage this
    # container (no Coolify label → Sentinel ignores it, no polling cost).
    labels:
      - "traefik.enable=true"

      # Plain HTTP → redirect to HTTPS.
      - "traefik.http.routers.waha-http.rule=Host(`waha.aeondelightasia.online`)"
      - "traefik.http.routers.waha-http.entrypoints=http"
      - "traefik.http.routers.waha-http.middlewares=waha-redirect-https"
      - "traefik.http.middlewares.waha-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.waha-redirect-https.redirectscheme.permanent=true"

      # HTTPS router with Let's Encrypt via Coolify's existing cert resolver.
      - "traefik.http.routers.waha.rule=Host(`waha.aeondelightasia.online`)"
      - "traefik.http.routers.waha.entrypoints=https"
      - "traefik.http.routers.waha.tls=true"
      - "traefik.http.routers.waha.tls.certresolver=letsencrypt"

      # WAHA listens on 3000 inside the container.
      - "traefik.http.services.waha.loadbalancer.server.port=3000"

networks:
  # Shared Docker network that Coolify's Traefik watches.
  # Must exist (Coolify creates it when its proxy is installed).
  coolify:
    external: true

volumes:
  sessions-v2:
